<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Word | Revolving Bible</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #102d25;
      color: #ffffff;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    h1 {
      color: #e3c77b;
      font-size: clamp(30px, 5vw, 52px);
      margin-bottom: 45px;
    }

    #passage {
      font-size: clamp(27px, 4vw, 48px);
      line-height: 1.5;
      margin: 30px auto;
    }

    #reference {
      color: #e3c77b;
      font-size: clamp(21px, 3vw, 30px);
      margin-top: 30px;
    }

    #countdown {
      margin-top: 45px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #d2ded8;
    }

    #status {
      font-family: Arial, sans-serif;
      font-size: 15px;
      color: #d2ded8;
      margin-top: 25px;
      #audio-controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
}

#audio-controls button {
    padding: 12px 18px;
    border: 1px solid #e3c77b;
    border-radius: 8px;
    background: #e3c77b;
    color: #102d25;
    font-size: 16px;
    cursor: pointer;
}

#audio-controls button:focus-visible {
    outline: 3px solid white;
    outline-offset: 3px;
}

#audioStatus {
    margin-top: 12px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #d2ded8;
}
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>Today's Word</h1>

   <div id="passage">Loading Scripture...</div>

<div id="reference"></div>

<div id="audio-controls">
    <button id="playAudio" onclick="playScripture()">▶ Play Scripture</button>
    <button id="pauseAudio" onclick="pauseScripture()">⏸ Pause</button>
    <button id="resumeAudio" onclick="resumeScripture()">▶ Resume</button>
    <button id="stopAudio" onclick="stopScripture()">■ Stop</button>
</div>
<label id="autoNarrationOption">
    <input
        type="checkbox"
        id="autoNarration"
        onchange="toggleAutomaticNarration(this.checked)"
    >
    Automatically read each new Scripture
</label>
<div id="audioStatus" role="status" aria-live="polite"></div>

<div id="countdown"></div>

    <div id="status">Connecting to Bible database...</div>
  </main>

  <script>
    // SUPABASE CONNECTION
    const SUPABASE_URL =
      "https://tthgeaiokpltmfxxmibb.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_FSBEnnrDXG1ysm5IDU71Gw_KeBEyp9t";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let passages = [];
    let rotationStart = 0;
    let rotationInterval = 60;
    let serverTimeOffset = 0;
    async function loadBiblePassages() {
      try {
           const requestStartedAt = Date.now();

const { data: serverTimeData, error: serverTimeError } =
    await supabaseClient.rpc("get_server_time");

const requestFinishedAt = Date.now();

if (serverTimeError) throw serverTimeError;

const serverTime = new Date(serverTimeData).getTime();

const clientMidpoint =
    (requestStartedAt + requestFinishedAt) / 2;

serverTimeOffset = serverTime - clientMidpoint; 
        const { data: bibleData, error: bibleError } =
          await supabaseClient
            .from("bible_passages")
            .select("*")
            .eq("active", true)
            .order("id", { ascending: true });

        if (bibleError) throw bibleError;

        const { data: settings, error: settingsError } =
          await supabaseClient
            .from("rotation_settings")
            .select("*")
            .eq("id", 1)
            .single();

        if (settingsError) throw settingsError;

        if (!bibleData || bibleData.length === 0) {
          throw new Error("No active Bible passages were found.");
        }

        passages = bibleData;
        rotationInterval = settings.rotation_interval_seconds;
        rotationStart = new Date(
          settings.rotation_start_at
        ).getTime();

        document.getElementById("status").textContent =
          passages.length + " KJV passages loaded successfully.";

        displayCurrentPassage();
        updateCountdown();

        setInterval(updateCountdown, 1000);

      } catch (error) {
        console.error(error);

        document.getElementById("status").textContent =
          "Unable to load Scripture. Please check your database connection.";
      }
    }

    function getCurrentIndex() {
     const currentServerTime = Date.now() + serverTimeOffset;

     const elapsedSeconds =
    Math.max(0, Math.floor((currentServerTime - rotationStart) / 1000));

      const rotationNumber =
        Math.floor(elapsedSeconds / rotationInterval);

      return rotationNumber % passages.length;
    }

    function displayCurrentPassage() {
      if (passages.length === 0) return;

      const currentIndex = getCurrentIndex();
      const passage = passages[currentIndex];

      document.getElementById("passage").textContent =
        passage.passage_text;

      let reference =
        passage.book + " " +
        passage.chapter + ":" +
        passage.verse_start;

      if (
        passage.verse_end &&
        passage.verse_end !== passage.verse_start
      ) {
        reference += "-" + passage.verse_end;
      }

      document.getElementById("reference").textContent =
        reference + " (KJV)";
      if (automaticNarrationEnabled) {
    playScripture();
}
    }

    function updateCountdown() {
      if (passages.length === 0) return;

     const currentServerTime = Date.now() + serverTimeOffset;

     const elapsedSeconds =
     Math.max(0, Math.floor((currentServerTime - rotationStart) / 1000));

      const secondsIntoCycle =
        elapsedSeconds % rotationInterval;

      const secondsRemaining =
        rotationInterval - secondsIntoCycle;

      document.getElementById("countdown").textContent =
        "Next Scripture in " + secondsRemaining + " seconds";

      if (secondsRemaining === rotationInterval) {
        displayCurrentPassage();
      }
    }

    loadBiblePassages();
    let automaticNarrationEnabled = false;

function toggleAutomaticNarration(enabled) {
    automaticNarrationEnabled = enabled;

    if (!enabled) {
        document.getElementById("audioStatus").textContent =
            "Automatic Scripture reading is off.";
        return;
    }

    document.getElementById("audioStatus").textContent =
        "Automatic Scripture reading is on.";
}
let scriptureSpeech = null;

function playScripture() {
    if (!("speechSynthesis" in window)) {
        document.getElementById("audioStatus").textContent =
            "Audio narration is not supported by this browser.";
        return;
    }

    window.speechSynthesis.cancel();

    const passage = document.getElementById("passage").innerText;
    const reference = document.getElementById("reference").innerText;

    scriptureSpeech = new SpeechSynthesisUtterance(
        reference + ". " + passage
    );

    scriptureSpeech.lang = "en-US";
    scriptureSpeech.rate = 0.85;

    scriptureSpeech.onstart = function () {
        document.getElementById("audioStatus").textContent =
            "Reading Scripture...";
    };

    scriptureSpeech.onend = function () {
        document.getElementById("audioStatus").textContent =
            "Scripture reading completed.";
    };

    scriptureSpeech.onerror = function () {
        document.getElementById("audioStatus").textContent =
            "Audio playback encountered a problem.";
    };

    window.speechSynthesis.speak(scriptureSpeech);
}

function pauseScripture() {
    window.speechSynthesis.pause();
    document.getElementById("audioStatus").textContent =
        "Scripture reading paused.";
}

function resumeScripture() {
    window.speechSynthesis.resume();
    document.getElementById("audioStatus").textContent =
        "Resuming Scripture reading...";
}

function stopScripture() {
    window.speechSynthesis.cancel();
    document.getElementById("audioStatus").textContent =
        "Scripture reading stopped.";
}

  </script>

</body>
</html>
