
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 220"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Revolving Bible</title>
  <desc id="desc">An open Bible surrounded by a golden circular arrow, representing the continuous sharing of Scripture.</desc>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D98A"/>
      <stop offset="100%" stop-color="#C69A43"/>
    </linearGradient>
  </defs>

  <rect width="600" height="220" rx="18" fill="#173D32"/>

  <!-- Circular movement -->
  <path d="M75 105 A75 75 0 1 1 105 174"
        fill="none" stroke="url(#gold)"
        stroke-width="7" stroke-linecap="round"/>

  <path d="M93 174 L108 174 L104 157"
        fill="none" stroke="url(#gold)"
        stroke-width="7" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Open Bible -->
  <path d="M35 119 Q72 101 108 121 L108 159
           Q72 140 35 157 Z"
        fill="#F5F1E7" stroke="#D9B96E" stroke-width="2"/>

  <path d="M108 121 Q144 101 181 119 L181 157
           Q144 140 108 159 Z"
        fill="#F5F1E7" stroke="#D9B96E" stroke-width="2"/>

  <path d="M108 121 L108 159"
        stroke="#C69A43" stroke-width="2"/>

  <!-- Book text lines -->
  <g stroke="#B6A98D" stroke-width="2" stroke-linecap="round">
    <path d="M48 130 L91 130 M48 139 L91 139 M48 148 L83 148"/>
    <path d="M123 130 L166 130 M123 139 L166 139 M123 148 L158 148"/>
  </g>

  <!-- Brand name -->
  <text x="215" y="101"
        font-family="Georgia, serif"
        font-size="39"
        font-weight="bold"
        fill="#F5F1E7">REVOLVING</text>

  <text x="215" y="145"
        font-family="Georgia, serif"
        font-size="39"
        font-weight="bold"
        fill="#D9B96E">BIBLE</text>

  <text x="217" y="176"
        font-family="Arial, sans-serif"
        font-size="15"
        letter-spacing="2"
        fill="#F5F1E7">READ • LISTEN • REFLECT</text>

</svg>
