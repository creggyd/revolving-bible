
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102d25">

  <title>Service Reading | Revolving Bible</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(20px, 4vw, 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background:
        radial-gradient(ellipse at center, #1b4939 0%, #102d25 65%, #091d18 100%);
      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: 100%;
      max-width: 1450px;
      margin: auto;
    }

    .brand-logo {
      display: block;
      width: min(48vw, 560px);
      max-height: 280px;
      height: auto;
      object-fit: contain;
      margin: 0 auto 25px;
    }

    #heading {
      color: #e3c77b;
      font-size: clamp(26px, 3.5vw, 44px);
      font-weight: normal;
      letter-spacing: 2px;
      line-height: 1.3;
      margin: 10px 0 40px;
      text-transform: uppercase;
    }

    #passage {
      max-width: 1300px;
      margin: 0 auto;
      font-size: clamp(30px, 4.2vw, 64px);
      line-height: 1.45;
      font-weight: normal;
      text-wrap: balance;
      white-space: pre-wrap;
    }

    .gold-divider {
      width: min(220px, 35%);
      height: 2px;
      margin: 35px auto 25px;
      background: linear-gradient(
        to right,
        transparent,
        #e3c77b,
        transparent
      );
    }

    #reference {
      color: #e3c77b;
      font-size: clamp(22px, 2.5vw, 34px);
      letter-spacing: 1px;
      margin-top: 15px;
    }

    #status {
      margin-top: 35px;
      color: #c5d4cc;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .brand-logo {
        width: min(75vw, 380px);
        max-height: 200px;
        margin-bottom: 15px;
      }

      #heading {
        margin-bottom: 25px;
      }

      #passage {
        line-height: 1.4;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      src="assets/revolving-bible-logo.png"
      alt="Revolving Bible"
      class="brand-logo"
    >
<h1 id="heading">SCRIPTURE READING</h1>

<div id="serviceType"></div>

<div id="serviceDate"></div>

<div id="passage" aria-live="polite">
  Waiting for the service reading...
</div>

<div class="gold-divider"></div>

<div id="reference"></div>

<div id="status" role="status" aria-live="polite">
  Connecting to the service reading...
</div>

  </main>

  <script>
    const SUPABASE_URL =
      "https://tthgeaiokpltmfxxmibb.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_FSBEnnrDXG1ysm5IDU71Gw_KeBEyp9t";
    const CHURCH_ID =
      "cd90c8c5-3931-4995-948b-9004dc398846";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let lastReadingId = null;
    let refreshInProgress = false;

    function makeReference(reading) {
      let reference =
        reading.book + " " +
        reading.chapter + ":" +
        reading.verse_start;

      if (
        reading.verse_end &&
        reading.verse_end !== reading.verse_start
      ) {
        reference += "-" + reading.verse_end;
      }

      return reference + " (" + reading.translation + ")";
    }

    async function loadServiceReading() {
      if (refreshInProgress) return;

      refreshInProgress = true;

      try {
       
        const {
          data: { session },
          error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
          document.getElementById("heading").textContent =
            "CHURCH SCRIPTURE READING";

          document.getElementById("serviceType").textContent = "";
          document.getElementById("serviceDate").textContent = "";

          document.getElementById("passage").textContent =
            "Please sign in with your church account to view this Scripture reading.";

          document.getElementById("reference").textContent = "";

          document.getElementById("status").textContent =
            "Sign-in is required to view this church reading.";

          lastReadingId = null;
          return;
        }

        const {
          data,
          error
        } = await supabaseClient
          .from("preacher_readings")
          .select(
            "id, book, chapter, verse_start, verse_end, passage_text, translation, service_date, service_type, display_heading, created_at"
          )
          .eq("church_id", CHURCH_ID)
          .order("service_date", { ascending: false })
          .order("created_at", { ascending: false })
          .limit(1)
          .maybeSingle();
      
        if (error) throw error;

        if (!data) {
          document.getElementById("heading").textContent =
            "SCRIPTURE READING";

          document.getElementById("passage").textContent =
            "The service reading has not yet been published.";

          document.getElementById("reference").textContent = "";

          document.getElementById("status").textContent =
            "Waiting for an authorised person to publish the reading.";

          lastReadingId = null;
          return;
        }

        if (data.id === lastReadingId) {
          return;
        }

        document.getElementById("heading").textContent =
          data.display_heading || "SCRIPTURE READING";
        document.getElementById("serviceType").textContent =
         data.service_type || "";

        document.getElementById("serviceDate").textContent =
       data.service_date
    ? new Date(data.service_date + "T00:00:00").toLocaleDateString()
    : "";
        document.getElementById("passage").textContent =
          data.passage_text;

        document.getElementById("reference").textContent =
          makeReference(data);

        document.getElementById("status").textContent =
          "Service reading";

        lastReadingId = data.id;

      } catch (error) {
        console.error("Service reading error:", error);

        document.getElementById("status").textContent =
          "Unable to retrieve the service reading. Retrying shortly.";

      } finally {
        refreshInProgress = false;
      }
    }

    loadServiceReading();

    // Check for a newly published reading every five seconds.
    setInterval(loadServiceReading, 5000);
  </script>
</body>
</html>
